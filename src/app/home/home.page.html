<ion-header>
  <ion-toolbar><ion-title>Mi GPS</ion-title></ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" (click)="obtenerUbicacion()">Obtener mi ubicación</ion-button>

  @if (urlUbicacion) {
  <p><a [href]="urlUbicacion" (click)="abrir($event, urlUbicacion)">📍 Ver mi posición en Google Maps</a></p>
  <p><a [href]="urlRuta" (click)="abrir($event, urlRuta)">🧭 Ver mi ruta</a></p>

  <ion-button expand="block" color="secondary" (click)="guardarUbicacion()">Guardar ubicación (.txt)</ion-button>
  <ion-button expand="block" color="tertiary" (click)="guardarRuta()">Guardar ruta (.txt)</ion-button>
  }
</ion-content>
